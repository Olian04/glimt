# Manual release: workflow_dispatch → validate version → tests → git tag → GoReleaser
# (trimpath builds for linux/darwin × amd64/arm64, checksums, changelog, GitHub Release).
# Configuration: .goreleaser.yaml.
#
# Tags are always vX.Y.Z (or vX.Y.Z-N for a prerelease), because the Go toolchain only
# resolves `go install github.com/Olian04/glimt@…` from semver tags with a leading v.
# A leading v in the input is optional; it is added when missing.
name: Release

run-name: Release ${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: X.Y.Z (release) or X.Y.Z-N (prerelease; N = increment, e.g. 0.5.0-1). Optional leading v."
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease (version must be X.Y.Z-N)"
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format and extract
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION="v${INPUT_VERSION#v}"
          if [ "$PRERELEASE" = "true" ]; then
            if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
              echo "::error::Prerelease version must match X.Y.Z-N (optional leading v), e.g. 0.5.0-1 or v0.5.0-1. Got: $INPUT_VERSION"
              exit 1
            fi
          else
            if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release version must match X.Y.Z (optional leading v), e.g. 0.5.0 or v0.5.0. Got: $INPUT_VERSION"
              exit 1
            fi
          fi
          git fetch --prune --tags origin
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists on the remote."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            BASE_VERSION="${VERSION%-*}"
            if git rev-parse -q --verify "refs/tags/$BASE_VERSION" >/dev/null 2>&1; then
              echo "::error::Tag '$BASE_VERSION' already exists on the remote. Prerelease '$VERSION' is for work toward stable $BASE_VERSION; that version must not be tagged or released yet (increment ${VERSION##*-} is the Nth prerelease *before* $BASE_VERSION)."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (prerelease=$PRERELEASE)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Before the tag exists: a failing golden snapshot must not leave a tag behind.
      - name: Test
        run: go test ./...

      - name: Create and push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION" "${GITHUB_SHA}"
          git push origin "refs/tags/$VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
